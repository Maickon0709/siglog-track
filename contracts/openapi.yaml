openapi: 3.1.0
info:
  title: SIG-Log Track — Sensor IoT
  description: Consultas e cadastro exigem o header **X-API-Key** do seu squad. O
    sensor usa **X-Device-Key** em `/sensor-readings`.
  version: 1.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /devices:
    post:
      tags:
      - dispositivos
      summary: Registrar Dispositivo
      operationId: registrar_dispositivo_devices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositivoIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /devices/{device_id}:
    get:
      tags:
      - dispositivos
      summary: Obter Dispositivo
      operationId: obter_dispositivo_devices__device_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sensor-readings:
    post:
      tags:
      - telemetria
      summary: Receber Leitura
      operationId: receber_leitura_sensor_readings_post
      parameters:
      - name: x-device-key
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Device-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeituraIn'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /shipments/{shipment_id}/location:
    get:
      tags:
      - consultas
      summary: Localizacao
      operationId: localizacao_shipments__shipment_id__location_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /shipments/{shipment_id}/history:
    get:
      tags:
      - consultas
      summary: Historico
      operationId: historico_shipments__shipment_id__history_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /alerts:
    get:
      tags:
      - consultas
      summary: Alertas
      operationId: alertas_alerts_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: shipmentId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Shipmentid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DispositivoIn:
      properties:
        deviceId:
          type: string
          title: Deviceid
          examples:
          - IOT-001
        shipmentId:
          type: string
          title: Shipmentid
          description: Vem do WMS (CargaExpedida)
          examples:
          - EXP-001
        vehicleId:
          anyOf:
          - type: string
          - type: 'null'
          title: Vehicleid
          description: Vem do Fleet
          examples:
          - VEI-042
        tripId:
          anyOf:
          - type: string
          - type: 'null'
          title: Tripid
          description: Vem do Fleet
          examples:
          - VIA-2026-0917
        tipoCarga:
          type: string
          title: Tipocarga
          description: VACINA, RESFRIADO, CONGELADO, AMBIENTE ou outro
          default: VACINA
        tempMin:
          anyOf:
          - type: number
          - type: 'null'
          title: Tempmin
        tempMax:
          anyOf:
          - type: number
          - type: 'null'
          title: Tempmax
        umidadeMax:
          anyOf:
          - type: number
          - type: 'null'
          title: Umidademax
      type: object
      required:
      - deviceId
      - shipmentId
      title: DispositivoIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LeituraIn:
      properties:
        deviceId:
          type: string
          title: Deviceid
        temperatura:
          type: number
          maximum: 100.0
          minimum: -60.0
          title: Temperatura
        umidade:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Umidade
        bateria:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Bateria
        latitude:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Longitude
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
      type: object
      required:
      - deviceId
      - temperatura
      title: LeituraIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Chave do squad que esta chamando (uma por squad)
      in: header
      name: X-API-Key

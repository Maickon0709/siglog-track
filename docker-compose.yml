# Sobe o SIG-Log Track completo: servico + RabbitMQ + Prometheus + Grafana.
#   docker compose up --build
services:
  track:
    build: .
    image: siglog-track:local
    ports:
      - "8000:8000"     # API (/docs) e o ESP32 envia para http://<ip-do-pc>:8000/sensor-readings
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      CONSUMIR_WMS: "true"
      DEVICE_API_KEY: ${DEVICE_API_KEY:-troque-esta-chave}
      SQUAD_API_KEYS: ${SQUAD_API_KEYS:-wms=dev-wms,fleet=dev-fleet,finance=dev-finance,people=dev-people,crm=dev-crm,track=dev-track}
      OFFLINE_SEGUNDOS: "60"
    depends_on:
      rabbitmq-definicoes:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"     # AMQP (os outros squads conectam aqui)
      - "15672:15672"   # painel http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # Importa exchanges, filas (com DLQ) e bindings de monitoring/rabbitmq/definitions.json.
  # A importacao pela API soma as definicoes as que ja existem (ex.: as do WMS) sem apagar nada.
  rabbitmq-definicoes:
    image: curlimages/curl:8.11.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./monitoring/rabbitmq/definitions.json:/definitions.json:ro
    command: >
      -fsS -u guest:guest -H "Content-Type: application/json"
      -X POST http://rabbitmq:15672/api/definitions --data-binary @/definitions.json

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"     # http://localhost:3000 (admin/admin)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
